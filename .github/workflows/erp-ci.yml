name: ERP CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/erp-scripts
          node <<'NODE'
          const fs=require("fs");
          const html=fs.readFileSync("index.html","utf8");
          const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(m=>m[1]).filter(s=>s.trim());
          if(!blocks.length) throw new Error("No inline script blocks found");
          blocks.forEach((code,i)=>fs.writeFileSync(`/tmp/erp-scripts/block-${i+1}.js`,code));
          console.log(`Extracted ${blocks.length} inline script blocks`);
          NODE
          for file in /tmp/erp-scripts/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
